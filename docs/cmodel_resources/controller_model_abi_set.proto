syntax = "proto3";
//添加命名空间
package MODEL_ABI;

enum MESSAGE_ATTRIBUTE_TYPE 
	{ 
		BYTES_E = 0; 
		STRING_E = 1; 
		IP_E = 3; 
		BOOL_E = 4;
		INT32_E = 5;
		UINT32_E = 6;
		INT64_E = 7;
		UINT64_E = 8;
		FLOAT_E = 9;
		DOUBLE_E = 10;
		FIXED_E = 11;
		DATA_COMBOX_E = 12;  //下拉框类型
	}

enum MESSAGE_ATTRIBUTE_OPTION 
	{ 
		REQUIRED_E = 0; //必选
		OPTIONAL_E = 1; //可选
	}

message Message_Combox_Item{
	string key = 1;				// 英文key值
	string desc = 2;			// 中文描述
	repeated Message_Attribute array_cmob_ele = 3;  //comb下拉框附属内容
}

message Message_Combox_Type{
	string type_key = 1;							
	string type_desc = 2; 							//实际类型值，可以填写空，或者默认某个值；
	repeated Message_Combox_Item  type_groups = 3;	//所有的下拉框的枚举，都采用Message_Combox_Type
}

//基础数据结构
message Message_Attribute {	
	string key = 1;
	string desc = 2;							// 描述(base64-方便中文显示)
    string tips  = 3;                           // 用于补充说明信息的，可以悬浮显示
	int32 maxCount = 4;							// 是否可以拷贝,用于属性扩充复制，
	MESSAGE_ATTRIBUTE_TYPE type = 5;	        // 与下面oneof同步使用
	oneof oneof_value {
		string string_value = 10;
		bool bool_value = 11;            //bool sting byte 类型的时候就不需要max和min
		int32 int32_value = 12;
		uint32 uint32_value = 13;
		int64 int64_value = 14;
		uint64 uint64_value = 15;
		float float_value = 16;
		double double_value = 17;
		bytes bytes_value = 18;
		string string_fix = 19;                //真实的值，可以默认为空开始；
		Message_Combox_Type combo_type = 20;   //combox下拉框类型的数据 
	}
	
	oneof oneof_maxValue {
		int32 int32_maxvalue = 30;
		uint32 uint32_maxvalue = 31;
		int64 int64_maxvalue = 32;
		uint64 uint64_maxvalue = 33;
		float float_maxvalue = 34;
		double double_maxvalue = 35;
	}
	
	oneof oneof_minValue {
		int32 int32_minvalue = 40;
		uint32 uint32_minvalue = 41;
		int64 int64_minvalue = 42;
		uint64 uint64_minvalue = 43;
		float float_minvalue = 44;
		double double_minvalue = 45;
	}
	
	string unit = 50;									 // 单位：deg ,rad,m,cm,mm...
	repeated string fixed_source = 51;                   // 当type是fixed时，指定数据源，采用绝对路径形式；
	bool copy_enable = 52;                               // 是否可复制
	MESSAGE_ATTRIBUTE_OPTION option = 53;                 // 是否必须
}

message Message_Custom_Combox_Element{           // 客制下拉选择框参数 
	string key = 1;	                             // 可选项key
	string desc = 2;                             // 可选项描述
	repeated Message_ArrayAttr array_attr = 10;		// 选中后需要显示的内容 - 数组
	repeated Message_ComboAttr combox_attr = 11;	    // 选中后需要显示的内容 - 下拉框
}

message Message_Custom_ComboAttr{           // 客制下拉选择框参数 
	repeated Message_Custom_Combox_Element element = 1;     //下拉框元素
	string default_select = 2;                               //下拉框 默认 数据来源 ，客户端将上述选择元素特化为 数据来源
}

message Message_Normal_Combox_Element{           
	string source_path = 1;
}

message Message_Normal_ComboAttr{           // 普通下拉选择框参数
	repeated Message_Normal_Combox_Element element = 1;                   
}

enum COMBOX_SOURCE_TYPE 
	{ 
		NORMAL_E = 0; //从其客户端已知内容里选
		CUSTOM_E = 1; //客制
	}

message Message_ComboAttr{     // 下拉选择框参数
    string key = 1;                            
	string desc	= 2;
	string tips = 3;
	COMBOX_SOURCE_TYPE combox_source = 4;     // 下拉框数据来源
	oneof combox_details{
		Message_Custom_ComboAttr custom_combox = 10;
		Message_Normal_ComboAttr normal_combox = 11;
	}
}

message Message_ArrayAttr{								// 列表参数,数组参数
	string group_key = 3;                              // 参数组名key
    string group_name = 1;                              // 参数组名
	MESSAGE_ATTRIBUTE_OPTION option = 2;                // 是否必须
	repeated Message_Attribute attr_params = 11;		// 元素参数
}

enum COMMON_ATTR_TYPE 
	{ 
		COMBOX_E = 0; 
		ARRAY_E = 1; 
	}
	
//参数；
message Message_CommonAttr {							// 通用具体参数属性/功能点,具体的属性/功能点信息
	string key = 1;                                     // 用来复制和删除此属性，没有的话不知道那些属性可被删除(原始只能被复制，复制来得可被删除，需要用此key判断)
	COMMON_ATTR_TYPE type = 10;							// 参数单元类型 与oneof组合使用
	oneof oneof_componentValue {		                // 具体参数的数据
		Message_ComboAttr combox_param = 11;				// 下拉选择框式的数据
		Message_ArrayAttr array_param = 12;				// 列表式的数据      
	}
	bool clone_enable = 32;								// 是否可以克隆
}

message Child_Function_Ability {						// 子类功能
	string type = 1;                               		// 功能子类 类型 嵌入式维护枚举
	string desc	= 2;		                       		// 描述 需要展示为什么
	string tips = 3;                                    // 提示 告知需要如何填写
	string key = 4;                                     // 用来复制和删除此属性，没有的话不知道那些属性可被删除(原始只能被复制，复制来得可被删除，需要用此key判断)
	repeated Message_CommonAttr attr = 10;              // 子类 功能 属性单元
	bool clone_enable = 11;								// 是否可以克隆
}

message Function_Ability {				      			// 大类功能
	string type = 1;                               		// 功能大类 类型 嵌入式维护枚举
	string desc	= 2;		                       		// 描述 需要展示为什么
	string tips = 3;                                    // 提示 告知需要如何填写
	repeated Child_Function_Ability child_function = 10;     // 子类 功能
}

message Component_Ability{                              // 器件 能力
	string type = 1;                                    // 器件 类型 是否需要提前定义枚举
	repeated string entity = 11;                        // 某一器件的 具体的类型 是否需要提前定义枚举
}

message Controller_Ability {
	string version = 1;									        // 能力文件 版本号
	repeated Component_Ability component_ability = 11;          // 器件 能力 与页面无关
	repeated Function_Ability function_ability = 12;            // 功能 能力 与页面有关
}